<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacy Chat Test</title>
<style>
  :root { --green:#008069; --green-d:#005c4b; --bg:#efeae2; --out:#d9fdd3; --in:#ffffff;
          --text:#111b21; --muted:#667781; --chip:#ffffff; --dbg:#f0f2f5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; background: #d1d7db; color: var(--text); }
  .app { max-width: 820px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg);
         box-shadow: 0 0 24px rgba(0,0,0,.12); }
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; }
  .who small { opacity: .85; font-size: 12.5px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .tools select, .tools button, .tools label { font: inherit; font-size: 12.5px; border-radius: 16px; border: 0; padding: 5px 10px;
         background: rgba(255,255,255,.18); color: #fff; cursor: pointer; }
  .tools select option { color: #111; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 6% 8px;
          background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 18px 18px; }
  .day { text-align: center; margin: 4px 0 12px; }
  .day span { background: #fff; color: var(--muted); font-size: 12px; padding: 4px 10px; border-radius: 8px; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
  .row { display: flex; margin: 3px 0; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 6px 9px 4px; border-radius: 8px; box-shadow: 0 1px .5px rgba(0,0,0,.13);
            white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; font-size: 14.5px; position: relative; }
  .me .bubble { background: var(--out); border-top-right-radius: 0; }
  .bot .bubble { background: var(--in); border-top-left-radius: 0; }
  .meta { float: right; margin: 6px 0 -2px 10px; font-size: 11px; color: var(--muted); direction: ltr; }
  .tick { color: #53bdeb; margin-left: 3px; }
  .debug { margin-top: 6px; background: var(--dbg); border-radius: 6px; padding: 6px 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
           direction: ltr; text-align: left; color: #3b4a54; white-space: pre-wrap; }
  .debug .t { color: var(--green-d); font-weight: 600; }
  .debug .g { color: #b42318; font-weight: 600; }
  body:not(.show-debug) .debug { display: none; }
  .typing .bubble { color: var(--muted); font-style: italic; }
  .chips { display: flex; gap: 6px; padding: 6px 10px; overflow-x: auto; background: var(--bg); }
  .chip { flex: none; background: var(--chip); border: 1px solid #d1d7db; border-radius: 16px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  .chip:hover { background: #f5f6f6; }
  footer { display: flex; gap: 8px; padding: 8px 10px; background: #f0f2f5; align-items: flex-end; }
  #msg { flex: 1; resize: none; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 15px; max-height: 120px; outline: none; background: #fff; }
  #send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 18px; cursor: pointer; flex: none; }
  #send:disabled { opacity: .5; cursor: default; }
  #attach { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; font-size: 22px; cursor: pointer; flex: none; color: var(--muted); }
  #attach:disabled { opacity: .5; cursor: default; }
  .bubble .file { padding: 8px 10px; margin-bottom: 4px; background: rgba(0,0,0,.05); border-radius: 6px; direction: ltr; }
  .bubble img { display: block; max-width: 260px; max-height: 320px; border-radius: 6px; margin-bottom: 4px; }
  @media (max-width: 560px) { #chat { padding: 12px 10px 6px; } .bubble { max-width: 88%; } .tools label span { display: none; } }
</style>
</head>
<body class="show-debug">
<div class="app">
  <header>
    <div class="avatar">💊</div>
    <div class="who"><b>الصيدلية · Pharmacy</b><small id="status">متصل · online</small></div>
    <div class="tools">
      <select id="model" title="model"></select>
      <label title="show tool calls"><input type="checkbox" id="dbg" checked> <span>debug</span></label>
      <button id="new" title="start a new conversation">محادثة جديدة</button>
    </div>
  </header>
  <div id="chat"><div class="day"><span>اليوم · Today — test chat (sample data only)</span></div></div>
  <div class="chips" id="chips"></div>
  <footer>
    <button id="attach" title="إرفاق صورة أو PDF للوصفة · attach prescription photo or PDF">📎</button>
    <input type="file" id="file" accept="image/*,application/pdf,.pdf" hidden>
    <textarea id="msg" rows="1" dir="auto" placeholder="اكتب رسالة · Type a message"></textarea>
    <button id="send" title="send">➤</button>
  </footer>
</div>
<script>
const $ = s => document.querySelector(s);
const chat = $("#chat"), msg = $("#msg"), send = $("#send"), statusEl = $("#status");
const SAMPLES = ["السلام عليكم", "عندكم بنادول؟", "ابغى علبتين بنادول 500 استلام من فرع جدة", "ايه اكد",
  "احجز لي فيتامين سي في فرع الرياض", "وين وصل طلبي؟", "كم حبة بنادول اعطي طفلي عمره سنتين؟",
  "ابغى اطلب ترامادول", "عندكم اوجمنتين؟", "Do you have Centrum?"];
let sid = null;
try { sid = localStorage.getItem("pharmacy_chat_sid"); } catch (e) {}
const now = () => new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bubble(who, text, debug, img, imgName) {
  const row = document.createElement("div");
  row.className = "row " + who;
  let html = `<div class="bubble" dir="auto">${img ? (img.startsWith("data:application/pdf") ? `<div class="file">📄 ${esc(imgName || "prescription.pdf")}</div>` : `<img src="${img}" alt="prescription">`) : ""}${esc(text)}<span class="meta">${now()}${who === "me" ? '<span class="tick">✓✓</span>' : ""}</span>`;
  if (debug) html += `<div class="debug">${debug}</div>`;
  row.innerHTML = html + "</div>";
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  return row;
}
function debugHtml(d, model) {
  const lines = [];
  if (d.guard) lines.push(`<span class="g">⛔ answered by ${esc(d.guard)}</span>`);
  if (!d.tools.length && !d.guard) lines.push("no tool call (text reply)");
  d.tools.forEach((t, i) => lines.push(`<span class="t">${i + 1}. ${esc(t.name)}</span>(${esc(JSON.stringify(t.args))})\n   → ${esc(t.result)}`));
  lines.push(`⏱ ${d.seconds}s · ${esc(model.split("/").pop())}`);
  return lines.join("\n");
}
async function api(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"},
                                body: body ? JSON.stringify(body) : undefined, credentials: "same-origin"});
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.json();
}
async function sendText(text, image, imageName) {
  text = text.trim(); if ((!text && !image) || send.disabled) return;
  bubble("me", text, null, image, imageName); msg.value = ""; msg.style.height = "auto";
  send.disabled = true; $("#attach").disabled = true;
  statusEl.textContent = image ? "يقرأ الوصفة… · reading prescription…" : "يكتب… · typing…";
  const typing = bubble("bot typing", "…");
  const t0 = Date.now(), tick = setInterval(() => {      // the CPU model can take a while
    typing.querySelector(".bubble").firstChild.nodeValue = `… ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 1000);
  try {
    const res = await api("/api/chat", {session_id: sid, text, model: $("#model").value || null,
                                        image: image || null, image_name: imageName || null});
    sid = res.session_id; try { localStorage.setItem("pharmacy_chat_sid", sid); } catch (e) {}
    typing.remove(); bubble("bot", res.reply, debugHtml(res.debug, res.model));
  } catch (e) {
    typing.remove(); bubble("bot", "⚠️ " + e.message);
  } finally {
    clearInterval(tick);
    send.disabled = false; $("#attach").disabled = false; statusEl.textContent = "متصل · online"; msg.focus();
  }
}
send.onclick = () => sendText(msg.value);
$("#attach").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { bubble("bot", "⚠️ الملف كبير جداً (الحد 8MB) · file too large (max 8 MB)"); return; }
  const r = new FileReader();
  r.onload = () => sendText(msg.value, r.result, f.name);   // any typed text goes with the photo
  r.readAsDataURL(f);
};
msg.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(msg.value); } });
msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 120) + "px"; });
$("#dbg").onchange = e => document.body.classList.toggle("show-debug", e.target.checked);
$("#new").onclick = async () => {
  if (sid) { try { await api("/api/reset", {session_id: sid}); } catch (e) {} }
  sid = null; try { localStorage.removeItem("pharmacy_chat_sid"); } catch (e) {}
  chat.innerHTML = '<div class="day"><span>محادثة جديدة · New conversation</span></div>';
};
$("#model").onchange = () => $("#new").onclick();
SAMPLES.forEach(s => { const c = document.createElement("button"); c.className = "chip"; c.dir = "auto"; c.textContent = s;
  c.onclick = () => sendText(s); $("#chips").appendChild(c); });
api("/api/models").then(m => m.models.forEach(n => { const o = document.createElement("option");
  o.value = n; o.textContent = n === m.default ? "production (base 4B)" : n.replace(":latest", ""); $("#model").appendChild(o); }))
  .catch(() => {});
msg.focus();
</script>
</body>
</html>
